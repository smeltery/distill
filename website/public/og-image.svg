<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>distill — Less context. More clarity.</title>
  <desc>A Markdown reference becomes three focused rules for an AI agent.</desc>
  <defs>
    <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="20" flood-opacity=".25"/></filter>
  </defs>
  <rect width="1200" height="630" fill="#1a1d29"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#fefdfb">
    <g transform="translate(62 46) scale(0.4583333333)">
  <rect width="96" height="96" rx="24" fill="#8b5cf6"/>
  <path fill="#fefdfb" fill-rule="evenodd" d="M35 22h26v6h-5v15l15 24c3.5 5.6-.5 13-7 13H32c-6.5 0-10.5-7.4-7-13l15-24V28h-5v-6Zm13 21c-3 5-9 10.5-9 16a9 9 0 0 0 18 0c0-5.5-6-11-9-16Z"/>
    </g>
    <text x="120" y="79" font-size="34" font-weight="700" letter-spacing="-1.8">distill.</text>
    <text x="1138" y="77" text-anchor="end" font-size="14" fill="#b1b3c4">A little context. A lot more clarity.</text>
    <text x="62" y="220" font-size="70" font-weight="600" letter-spacing="-3.5">Less context.</text>
    <text x="62" y="301" font-size="70" font-weight="600" letter-spacing="-3.5">More clarity.</text>
    <text x="62" y="388" font-family="Georgia, serif" font-style="italic" font-size="66" fill="#a78bfa" letter-spacing="-3">Better instincts.</text>
    <text x="66" y="448" font-size="18" fill="#b1b3c4">Turn trusted references into focused</text>
    <text x="66" y="477" font-size="18" fill="#b1b3c4">knowledge your AI agent can use.</text>
    <g transform="translate(645 166) rotate(-3 235 160)" filter="url(#shadow)">
      <rect width="485" height="298" rx="14" fill="#222635" stroke="#444054"/>
      <path d="M0 43h485" stroke="#444054"/>
      <circle cx="20" cy="22" r="5" fill="#8b5cf6"/><circle cx="38" cy="22" r="5" fill="#65517f"/><circle cx="56" cy="22" r="5" fill="#474156"/>
      <text x="242" y="27" text-anchor="middle" font-size="12" fill="#b1b3c4">Your knowledge, distilled</text>
      <rect x="22" y="67" width="153" height="206" rx="8" fill="#1a1d29" stroke="#38394d"/>
      <text x="38" y="94" font-size="12" fill="#b1b3c4">engineering.md</text>
      <g stroke="#494657" stroke-width="4" stroke-linecap="round"><path d="M38 115h120M38 129h108M38 143h120M38 157h95M38 171h120M38 185h110M38 199h120M38 213h85M38 227h117M38 241h65"/></g>
      <rect x="196" y="67" width="266" height="206" rx="8" fill="#302942" stroke="#8060b7"/>
      <text x="215" y="94" font-size="12" fill="#c6b0f5">guide-minified.md</text>
      <text x="215" y="132" font-size="21" font-weight="600">What matters.</text>
      <g font-size="12"><text x="215" y="167" fill="#a78bfa">01</text><text x="242" y="167">Keep functions focused.</text><text x="215" y="199" fill="#a78bfa">02</text><text x="242" y="199">Make errors explicit.</text><text x="215" y="231" fill="#a78bfa">03</text><text x="242" y="231">Preserve the important why.</text></g>
    </g>
    <path d="M62 543h1076" stroke="#38394d"/>
    <text x="62" y="582" font-size="13" fill="#b1b3c4">MARKDOWN IN. CLARITY OUT.</text>
    <text x="1138" y="582" text-anchor="end" font-size="14" fill="#a78bfa">github.com/smeltery/distill</text>
  </g>
</svg>
